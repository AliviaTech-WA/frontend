<main class="auth-shell">
  <section class="panel-marca" aria-labelledby="titulo-presentacion">
    <div class="marca" aria-label="AliviaTech">
      <span class="marca-icono" aria-hidden="true">A</span>
      <span>AliviaTech</span>
    </div>

    <div class="presentacion">
      @if (etiqueta()) {
        <span class="etiqueta">{{ etiqueta() }}</span>
      }
      <h1 id="titulo-presentacion">{{ titulo() }}</h1>
      <p>{{ descripcion() }}</p>
    </div>

    <div class="alcance">
      <strong>Diseñado para acompañar, no para vigilar.</strong>
      <span>No es un servicio de emergencia ni monitoreo 24/7.</span>
    </div>
  </section>

  <section class="panel-contenido">
    <ng-content />
  </section>
</main>
