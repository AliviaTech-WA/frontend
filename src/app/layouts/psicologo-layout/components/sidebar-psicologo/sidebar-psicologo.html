
<aside class="sidebar">

  <!-- Logo y nombre de la aplicación -->
  <div class="marca">
    <div class="logo">A</div>

    <div>
      <h3>AliviaTech</h3>
      <p>Espacio profesional</p>
    </div>
  </div>

  <!-- Menú de navegación del psicólogo -->

  <nav class="menu">

    <a routerLink="/psicologo/inicio" routerLinkActive="activo">
      <svg class="icono-menu" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7"/>
        <path d="M5 9v12h14V9"/>
        <path d="M9 21v-8h6v8"/>
      </svg>
      Inicio
    </a>

    <a routerLink="/psicologo/pacientes" routerLinkActive="activo">
      <svg class="icono-menu" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="3"/>
        <path d="M3 20v-2a6 6 0 0 1 12 0v2"/>
        <path d="M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>
      </svg>
      Pacientes
    </a>

    <a routerLink="/psicologo/reportes" routerLinkActive="activo">
      <svg class="icono-menu" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20h16"/>
        <rect x="5" y="11" width="3" height="9" rx="1"/>
        <rect x="11" y="7" width="3" height="13" rx="1"/>
        <rect x="17" y="3" width="3" height="17" rx="1"/>
      </svg>
      Reportes
    </a>

    <a routerLink="/psicologo/nuevo-paciente" routerLinkActive="activo">
      <svg class="icono-menu" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="4"/>
        <path d="M2 21v-2a7 7 0 0 1 14 0v2"/>
        <path d="M19 8v8M15 12h8"/>
      </svg>
      Nuevo paciente
    </a>

  </nav>


  <!-- Información inferior del sidebar -->
  <div class="parte-inferior">

    <div class="mensaje">
      <strong>Seguimiento asincrónico</strong>
      <p>
        Revisa la información cuando corresponda,
        sin monitoreo en tiempo real.
      </p>
    </div>

    <!-- Información del psicólogo -->
    <!-- Los datos se tienen que cambiar de acuerdo al usuario -->
    <a routerLink="/psicologo/perfil" class="perfil">
      <div class="avatar">{{ iniciales }}</div>

      <div class="datos-perfil">
        <strong>{{ nombreUsuario }}</strong>
        <span>Psicólogo</span>
      </div>

      <!-- Flecha decorativa -->
      <span class="flecha" aria-hidden="true">›</span>

    </a>

  </div>

</aside>
